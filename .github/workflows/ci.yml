# CI — PHẦN C §4: backend (build, test, SpotBugs+FindSecBugs, Dependency-Check), frontend (lint, typecheck, test, build, npm audit),
# e2e (docker-compose + Playwright), quét bảo mật (Semgrep OWASP Top 10, ZAP baseline), package (tarball cài đặt).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '${{ env.JAVA_VERSION }}', cache: maven }
      - name: Build + unit + integration test (Testcontainers)
        working-directory: backend
        run: ./mvnw -B verify
      - name: SpotBugs + FindSecBugs, OWASP Dependency-Check (fail CVSS ≥ 7)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Psecurity -DskipTests verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/spotbugsXml.xml
            backend/target/dependency-check-report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: backend-jar, path: backend/target/kpi-bsc-*.jar }

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run test
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: frontend-dist, path: frontend/dist }

  semgrep:
    runs-on: ubuntu-24.04
    container: { image: semgrep/semgrep:1.95.0 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config p/owasp-top-ten --config p/java --config p/typescript --error --severity ERROR --exclude frontend/e2e --exclude perf

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '${{ env.JAVA_VERSION }}' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: backend-jar, path: backend/target }
      - name: Hạ tầng dev (MariaDB, MinIO, Mailpit, mock CAS, mock nguồn KPI)
        run: docker compose -f deploy/docker-compose.dev.yml up -d --wait
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mv ../backend/target/kpi-bsc-*.jar ../backend/target/kpi-bsc-1.0.0.jar || true
          npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: playwright-report, path: frontend/playwright-report }

  zap-baseline:
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # cần .zap/rules.tsv
      - name: ZAP baseline trên staging
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ vars.STAGING_URL || 'https://kpi-staging.vnpt.vn' }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false

  package:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: backend-jar, path: backend/target }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: frontend-dist, path: frontend/dist }
      - run: bash deploy/scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: kpi-bsc-tarball, path: dist-package/kpi-bsc-*.tar.gz }
