# Nginx staging: giống deploy/nginx/kpi.conf nhưng TLS kết thúc ở Caddy dùng chung (VM BlueStar) → listen 80 trong mạng Docker.
upstream kpi_backend {
    server app:8088 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Chỉ tin X-Forwarded-For từ Caddy (mạng Docker 172.16.0.0/12) → $remote_addr = IP thật người dùng
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=kpi_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kpi_api:20m rate=50r/s;

server {
    listen 80;
    server_name kpi-bsc.14.225.83.93.sslip.io;
    server_tokens off;
    client_max_body_size 12m;
    root /opt/kpi-bsc/web;

    include /etc/nginx/kpi-security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /api/auth/login {
        limit_req zone=kpi_login burst=5 nodelay;
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
    }
    location /api/ {
        limit_req zone=kpi_api burst=100 nodelay;
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
    }
    # tài liệu API và actuator (trừ health) không mở ra Internet ở staging
    location /api/docs { return 404; }
    location /api/actuator/ { return 404; }
    location ~ ^/api/actuator/health(/.*)?$ {
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/kpi-security-headers.conf;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/kpi-security-headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|old|orig|sql|env|log)$ { deny all; }
}
