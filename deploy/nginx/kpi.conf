# Nginx — Hệ thống quản trị KPI theo BSC (APP_01 / APP_02, sau F5)
# - Phục vụ SPA (frontend/dist) tại /opt/kpi-bsc/web, proxy /api → Spring Boot 127.0.0.1:8088
# - TLS kết thúc tại F5 hoặc tại đây (khối server 443 bên dưới); chỉ mở 443 ra ngoài
# - Header bảo mật (PHẦN B §9), gzip, cache tài nguyên tĩnh có hash

upstream kpi_backend {
    server 127.0.0.1:8088 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# IP thật của người dùng khi F5 SNAT: chỉ tin header X-Forwarded-For từ dải IP self-IP/floating của F5.
# THAY 10.0.0.0/24 bằng dải IP F5 thực tế (xem docs/TRIEN-KHAI.md mục F5). Rate limit + log + audit dùng $remote_addr sau bước này.
set_real_ip_from 10.0.0.0/24;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=kpi_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kpi_api:20m rate=50r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # F5 health check (không chuyển hướng)
    location = /healthz { proxy_pass http://kpi_backend/api/actuator/health/readiness; access_log off; }
    location / { return 301 https://kpi.vnpt.vn$request_uri; }   # tên miền cố định (không dùng $host do client gửi)
}

server {
    listen 443 ssl http2;   # cú pháp tương thích Nginx 1.18 (Ubuntu 20.04/22.04); Nginx ≥ 1.25.1 có thể dùng 'http2 on;'
    server_name kpi.vnpt.vn;

    ssl_certificate     /etc/kpi/tls/fullchain.pem;
    ssl_certificate_key /etc/kpi/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;          # = kpi.file.max-size + overhead
    client_body_timeout 30s;
    send_timeout 60s;

    # ---------- Header bảo mật ----------
    include /etc/nginx/kpi-security-headers.conf;

    # ---------- Nén ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    # brotli on; brotli_types ...;   # bật nếu đã cài module ngx_brotli

    root /opt/kpi-bsc/web;
    index index.html;

    # ---------- API ----------
    location = /api/auth/login {
        limit_req zone=kpi_login burst=5 nodelay;
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
    }
    location /api/ {
        limit_req zone=kpi_api burst=100 nodelay;
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
    }
    # tài liệu API (Swagger/OpenAPI) chỉ cho mạng nội bộ — prod nên đặt thêm SWAGGER_ENABLED=false
    location /api/docs {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
    }
    # actuator chỉ cho mạng nội bộ (giám sát), trừ health
    location /api/actuator/ {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
    }
    location ~ ^/api/actuator/health(/.*)?$ {
        include /etc/nginx/kpi-proxy.conf;
        proxy_pass http://kpi_backend;
        access_log off;
    }

    # ---------- SPA ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/kpi-security-headers.conf;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/kpi-security-headers.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # chặn file ẩn / sao lưu
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(bak|old|orig|sql|env|log)$ { deny all; }
}
