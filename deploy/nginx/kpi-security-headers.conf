# Header bảo mật (PHẦN B §9.9) — include ở mức server VÀ trong mọi location có add_header riêng
# (Nginx không kế thừa add_header của mức trên khi location khai báo add_header).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# style-src 'unsafe-inline': React style={} và ECharts/XYFlow đặt style inline; script-src KHÔNG có unsafe-inline/eval.
# Không bật Cross-Origin-Embedder-Policy: tệp minh chứng mở bằng URL ký trước của MinIO (khác origin) sẽ bị chặn.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://sso.vnpt.vn; object-src 'none'" always;
