# Cấu hình chung — secret đọc từ biến môi trường (secret store /etc/kpi/secrets.env), không hard-code
server:
  port: ${SERVER_PORT:8088}
  servlet:
    context-path: /api
    encoding: { charset: UTF-8, force: true }
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2048
  tomcat:
    max-swallow-size: 25MB

spring:
  application:
    name: kpi-bsc
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/kpi_bsc}
    username: ${DB_USER:kpi_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: kpi-hikari
  flyway:
    enabled: true
    user: ${DB_MIGRATE_USER:kpi_migrate}
    password: ${DB_MIGRATE_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: KpiBscScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.threadCount: 5
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=60s

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    jdbc-type-for-null: NULL

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # F5 health check: node chỉ nhận traffic khi kết nối được CSDL (liveness không phụ thuộc DB)
        readiness:
          include: readinessState,db
  info:
    build:
      enabled: true
    env:
      enabled: true
  health:
    mail:
      enabled: false

info:
  app:
    name: Phần mềm quản trị KPI theo BSC
    vendor: VNPT-IT

springdoc:
  api-docs:
    path: /docs/api-docs
  swagger-ui:
    path: /docs
  packages-to-scan: vn.vnpt.kpi

kpi:
  bootstrap:
    admin-username: ${KPI_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${KPI_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt-secret: ${KPI_JWT_SECRET:}
    jwt-secret-previous: ${KPI_JWT_SECRET_PREVIOUS:}
    access-ttl: ${KPI_ACCESS_TTL:15m}
    refresh-ttl: ${KPI_REFRESH_TTL:8h}
    idle-timeout: ${KPI_IDLE_TIMEOUT:30m}
    cookie-secure: ${KPI_COOKIE_SECURE:true}
    cookie-same-site: ${KPI_COOKIE_SAMESITE:Lax}
    cookie-domain: ${KPI_COOKIE_DOMAIN:}
    bypass-sso: ${BYPASS_SSO:false}
    cors-allowed-origins: ${KPI_CORS_ORIGINS:}
    login-rate-limit-per-minute: ${KPI_LOGIN_RATE_LIMIT:20}
    pii-encryption-key: ${KPI_PII_KEY:}
  cas:
    enabled: ${CAS_ENABLED:true}
    server-url: ${CAS_SERVER_URL:}
    service-url: ${CAS_SERVICE_URL:}
    protocol: ${CAS_PROTOCOL:3.0}
    slo-enabled: ${CAS_SLO_ENABLED:false}
    frontend-url: ${KPI_FRONTEND_URL:/}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9100}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:kpi-files}
    presign-ttl-seconds: 300
  kpi-source:
    api-key: ${KPI_SOURCE_API_KEY:}
    api-key-header: ${KPI_SOURCE_API_KEY_HEADER:X-Api-Key}
    bearer-token: ${KPI_SOURCE_BEARER:}
    basic-user: ${KPI_SOURCE_BASIC_USER:}
    basic-password: ${KPI_SOURCE_BASIC_PASSWORD:}
    timeout-seconds: 10
    retries: 2
  clamav:
    enabled: ${CLAMAV_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    # bật quét mà clamd không phản hồi → từ chối tải tệp (false = cho qua, đánh dấu CHUA_QUET)
    fail-closed: ${CLAMAV_FAIL_CLOSED:true}
  zalo:
    access-token: ${ZALO_ACCESS_TOKEN:}
  mail:
    from: ${MAIL_FROM:kpi-bsc@vnpt.vn}
  hrm:
    enabled: ${HRM_ENABLED:false}
  demo-seed: ${KPI_DEMO_SEED:false}
  read-replica:
    enabled: ${READ_REPLICA_ENABLED:false}
    url: ${DB_REPLICA_URL:}
